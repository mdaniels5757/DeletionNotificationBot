- name: publisher
  image: python3.11
  command: $HOME/DeletionNotificationBot/start_pre_del_publisher.sh
  continuous: true
  health-check-script: ./publisher-health-check.bash
- name: notifier
  image: python3.11
  command: $HOME/DeletionNotificationBot/start_pre_del_notify.sh
  continuous: true
  health-check-script: ./notifier-health-check.bash
- name: logrotate
  command: bash $HOME/logrotate.sh
  image: bookworm
  no-filelog: true
  schedule: "@daily"
