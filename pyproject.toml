[project]
name = "deletionnotificationbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "mwparserfromhell>=0.7.2",
    "pywikibot>=11.10.0",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "ruff>=0.17.4",
    "sseclient>=0.0.27",
    "tqdm>=4.70.1",
    "ty>=0.0.100",
    "urllib3>=2.8.0",
    "wikitextparser>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
# The application is run as scripts from this directory, so its modules are
# intentionally importable directly from `predeletion/` (for example,
# `from models import DeletionNomination`).  Mirror that runtime import path
# for static analysis; pytest's conftest already does the same at runtime.
extra-paths = ["predeletion"]
